name: Update Airline Data

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 6am UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Fetch latest airlines.dat from OpenFlights
        run: wget -q https://raw.githubusercontent.com/jpatokal/openflights/master/data/airlines.dat
      - name: Apply local corrections to airlines.dat
        run: node normalize.js
      - name: Regenerate airlines.json
        run: node convert.js
      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet airlines.dat airlines.json; then
            echo "No data changes."
            # GitHub automatically disables scheduled workflows if there are no repository commits for 60 days.
            # If no commits have been made in the last 40 days, create a keepalive commit to reset the timer.
            LAST_COMMIT_TS=$(git log -1 --format=%ct)
            NOW_TS=$(date +%s)
            DAYS_SINCE=$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))
            echo "Days since last commit: $DAYS_SINCE"
            if [ "$DAYS_SINCE" -ge 40 ]; then
              echo "Repository inactive for $DAYS_SINCE days (>= 40 days); creating keepalive commit to prevent workflow disable."
              date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive
              git add .github/.keepalive
              if ! git diff --staged --quiet; then
                git commit -m "chore(keepalive): touch .github/.keepalive [skip ci]"
                git pull --rebase origin master
                git push origin master
              fi
            fi
          else
            npm version patch --no-git-tag-version
            git add airlines.dat airlines.json package.json package-lock.json
            git commit -m "chore: update airline data from OpenFlights"
            git pull --rebase origin master
            git push origin master
          fi
